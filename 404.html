<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>หน้านี้ไม่อยู่ในต้นแบบ | MRTA Learning Center</title>
<style>
    :root { --bg: #f2f5fa; --card: #ffffff; --ink: #1b2a4e; --muted: #454f69; --navy: #002777; --line: #d5dbe6; --focus: #ffbf47; }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --bg: #0b1430; --card: #13204a; --ink: #ffffff; --muted: #c7d2ea; --navy: #c7d2ea; --line: #2c3a66; }
    }
    :root[data-theme="dark"] { --bg: #0b1430; --card: #13204a; --ink: #ffffff; --muted: #c7d2ea; --navy: #c7d2ea; --line: #2c3a66; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
           font-family: "IBM Plex Sans Thai", "Sarabun", system-ui, sans-serif; font-size: 18px; line-height: 1.7; }
    main { width: min(100%, 560px); padding: 36px 32px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
    h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.4; }
    p { margin: 0 0 24px; color: var(--muted); max-width: 60ch; }
    ul { display: flex; flex-wrap: wrap; gap: 12px; margin: 0; padding: 0; list-style: none; }
    a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border: 2px solid var(--navy); border-radius: 999px;
        color: var(--navy); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
</style>
</head>
<body>
<main>
    <h1>หน้านี้ไม่อยู่ในต้นแบบ</h1>
    <p>เว็บนี้เป็นต้นแบบหน้าตาตามเกณฑ์ WCAG 2.2 ระดับ AAA ของ MRTA Learning Center มีเฉพาะหน้าแรก ลิงก์ไปหน้าหรือระบบอื่นจึงยังไม่เปิดใช้งาน</p>
    <ul>
        <li><a href="/">กลับหน้าแรก</a></li>
    </ul>
</main>
</body>
</html>
